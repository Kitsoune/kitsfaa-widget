; Fish an Anime RNG (FAA) Macro Configuration
; Edition: Laptop (Compact Screen / Stepped Scroll / 24/7 Dedicated)
; 1 = Buy potion on restock, 0 = Skip potion

[Potions_Row1]
Buy_Cash_Lvl1 = 1
Buy_Cash_Lvl2 = 1
Buy_Cash_Lvl3 = 1

[Potions_Row2]
Buy_Gems_Lvl1 = 1
Buy_Gems_Lvl2 = 1
Buy_Gems_Lvl3 = 1

[Potions_Row3]
Buy_Mutation_Lvl1 = 1
Buy_FastCatch_Lvl1 = 1
Buy_Luck_Lvl1 = 1

[Shop_Settings]
; Shop mode: "Boosts" or "Selene"
ShopMode = Boosts
; Delay in seconds after the 5-minute mark (:00, :05...) to ensure server restocked
ServerClockOffsetSeconds = 7
; Wait time for shop interface to load (milliseconds)
ShopOpenDelayMs = 4000
ClicksPerButton = 3
ClickIntervalMs = 700
; Wheel ticks per row (2 ticks for laptop stepped scroll)
ScrollWheelTicks = 2
; Button height ratios for laptop screen
ShopCashRatioY = 0.4653
ShopGemsRatioY = 0.4700
ShopSpecialsRatioY = 0.4900

[Virtual_Desktop]
; Disabled by default on dedicated laptop foreground setup
AutoSwitchDesktop = 0
DesktopStepsRight = 2
DesktopSwitchDelayMs = 350

[Navigation_Settings]
WalkKey = q
WalkDurationMs = 1600
AdjustKey = d
AdjustDurationMs = 350
AutoRecoveryEnabled = 1

[Fishing_Settings]
; Relative water coordinates (calibratable with F8)
WaterRatioX = 0.305
WaterRatioY = 0.544
FishClickIntervalMs = 1200
AntiAfkIntervalSeconds = 180

[Hallows_Eve]
; OCR event detection
EnableHallowsEve = 1
; Hotbar slot for clean character (equipped during Hallows Eve)
EventCharSlot = 2
; Hotbar slot outside event (0 = re-click EventCharSlot to unequip/hide it, or specify another slot)
NormalCharSlot = 0
CheckIntervalSeconds = 4
; Relative banner bounding box (calibratable with F7)
EventRatioX = 0.35
EventRatioY = 0.04
EventRatioW = 0.30
EventRatioH = 0.12

[Selene_Settings]
; Fixed 30-minute Selene cycle (:00 and :30)
SeleneCycleMinutes = 30
SeleneDurationMinutes = 5
SeleneClockOffsetSeconds = 0

[Sound_Settings]
EnableSoundBeep = 0

[Event_Settings]
EventClockOffsetSeconds = 0

[Rod_Ability]
; Rod ability auto-trigger
EnableRodAbility = 1
RodAbilityKey = v
; Cooldown in seconds (8m 01s = 481 seconds)
RodAbilityCooldownSeconds = 481
