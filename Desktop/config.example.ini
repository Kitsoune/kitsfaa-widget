; Fish an Anime RNG (FAA) Macro Configuration
; Edition: Desktop (Wide Screen / 3-Tick Scroll)
; 1 = Buy potion on restock, 0 = Skip potion

[Potions_Row1]
Buy_Cash_Lvl1 = 1
Buy_Cash_Lvl2 = 1
Buy_Cash_Lvl3 = 1

[Potions_Row2]
Buy_Gems_Lvl1 = 1
Buy_Gems_Lvl2 = 1
Buy_Gems_Lvl3 = 1

[Potions_Row3]
Buy_Mutation_Lvl1 = 1
Buy_FastCatch_Lvl1 = 1
Buy_Luck_Lvl1 = 1

[Shop_Settings]
; Shop mode: "Boosts" or "Selene"
ShopMode =Boosts
; Delay in seconds after the 5-minute mark (:00, :05...) to ensure server restocked
ServerClockOffsetSeconds = 7
; Wait time for shop interface to load (milliseconds)
ShopOpenDelayMs = 4000
ClicksPerButton = 3
ClickIntervalMs = 700
; Wheel ticks to scroll down to row 3 (3 ticks for desktop)
ScrollWheelTicks = 3

[Virtual_Desktop]
; Automatically switch Windows virtual desktops (1 = Enabled, 0 = Disabled)
AutoSwitchDesktop = 1
; Number of desktops to the right where Roblox is located
DesktopStepsRight = 2
DesktopSwitchDelayMs = 350

[Navigation_Settings]
WalkKey = q
WalkDurationMs = 1600
AdjustKey = d
AdjustDurationMs = 350
AutoRecoveryEnabled = 1

[Fishing_Settings]
; Relative water coordinates (calibratable with F8)
WaterRatioX = 0.324
WaterRatioY = 0.556
FishClickIntervalMs = 1200
AntiAfkIntervalSeconds = 180

[Hallows_Eve]
; OCR event detection
EnableHallowsEve = 1
; Hotbar slot for clean character (equipped during Hallows Eve)
EventCharSlot = 2
; Hotbar slot outside event (0 = re-click EventCharSlot to unequip/hide it, or specify another slot)
NormalCharSlot = 0
CheckIntervalSeconds = 4
; Relative banner bounding box (calibratable with F7)
EventRatioX =0.464
EventRatioY =0.064
EventRatioW =0.073
EventRatioH =0.036

[Selene_Settings]
; Fixed 30-minute Selene cycle (:00 and :30)
SeleneCycleMinutes = 30
SeleneDurationMinutes = 5
SeleneClockOffsetSeconds = 0

[Sound_Settings]
EnableSoundBeep = 0



[Rod_Ability]
; Rod ability auto-trigger
EnableRodAbility = 1
RodAbilityKey = v
; Cooldown in seconds (8m 01s = 481 seconds)
RodAbilityCooldownSeconds = 481

[Selene_Potions]
; Only these 4 items are allowed to be purchased in Selene's Store (1 = Buy, 0 = Skip)
; Never touches any other card or Robux buttons!
Buy_Luck_Lvl3 = 1
Buy_HeavensCollide = 1
Buy_Luck_Lvl2 = 1
Buy_Food_Lvl1 = 1

[Auto_Rebirth]
; Automatically open Rebirth menu, click green cash rebirth, and close (1 = Enabled, 0 = Disabled)
; 100% Robux-safe (strictly left button only)
EnableAutoRebirth = 1
; Interval in minutes between rebirth checks (default: 60)
RebirthIntervalMinutes = 60

