; =======================================================
;   CONFIGURATION - FISH AN ANIME RNG (FAA) MACRO
; =======================================================
; 1 = Acheter automatiquement cette potion lors du restock
; 0 = Ne PAS acheter cette potion
; (Utile pour désactiver les potions trop chères au début comme 50T ou 10Qa)

[Potions_Ligne1]
; Cash Potions (Ligne 1 : $7.5K, $20B, $10Qa)
Buy_Cash_Lvl1 = 1
Buy_Cash_Lvl2 = 1
Buy_Cash_Lvl3 = 1

[Potions_Ligne2]
; Gems Potions (Ligne 2 : $15M, $30B, $150Qa)
Buy_Gems_Lvl1 = 1
Buy_Gems_Lvl2 = 1
Buy_Gems_Lvl3 = 1

[Potions_Ligne3]
; Potions Spéciales (Ligne 3 : Mutation $50T, Fast Catch $2.5M, Luck $10B)
Buy_Mutation_Lvl1 = 1
Buy_FastCatch_Lvl1 = 1
Buy_Luck_Lvl1 = 1

[Shop_Settings]
; Le shop reset automatiquement à heure fixe toutes les 5 minutes (:00, :05, :10, :15, :20, etc.)
; Délai de sécurité en secondes après la minute (7s garantit que le serveur Roblox a restocké même avec le switch de bureau)
ServerClockOffsetSeconds = 7

; Délai d'attente après avoir appuyé sur E pour que le shop s'ouvre (4000ms = 4 secondes pour que l'interface soit 100% affichée)
ShopOpenDelayMs = 4000

; Nombre de clics par bouton Cash (3 clics pour vider le stock)
ClicksPerButton = 3

; Intervalle entre chaque clic sur un bouton Cash (en millisecondes : 700 = 0.7s, pas de spam pour laisser le serveur valider)
ClickIntervalMs = 700

; Nombre de crans de molette pour descendre à la ligne 3 (3 légers coups comme sur vos captures)
ScrollWheelTicks = 3

[Virtual_Desktop]
; Basculement automatique de bureau virtuel Windows (1 = Activé, 0 = Désactivé)
; Permet de rester sur votre Bureau 1 pendant que Roblox tourne sur le Bureau 3 !
AutoSwitchDesktop = 1

; Nombre de bureaux vers la droite pour atteindre Roblox depuis votre bureau principal
; (2 = passe du Bureau 1 au Bureau 3)
DesktopStepsRight = 2

; Délai d'attente entre chaque transition de bureau (350ms recommandé pour la fluidité Windows)
DesktopSwitchDelayMs = 350

[Navigation_Settings]
; Configuration pour clavier AZERTY
; Touche de marche principale vers la gauche (stand Boosts à 9h)
WalkKey = q
; Durée de marche vers la gauche (en millisecondes : 1600 = 1.6 seconde)
WalkDurationMs = 1600

; Petit coup correctif vers la droite pour se caler pile sur l'interaction [E]
AdjustKey = d
; Durée du coup vers la droite (en millisecondes : 350 = 0.35 seconde)
AdjustDurationMs = 350

; Auto-Recovery : Détecte automatiquement si vous êtes déconnecté ou respawné hors de l'eau
; et vous ramène automatiquement au stand Boosts (1 = Activé, 0 = Désactivé)
AutoRecoveryEnabled = 1

[Fishing_Settings]
; Coordonnées relatives du clic sur l'eau dans le vide (loin de tout bouton UI)
; 0.28 et 0.65 = dans le canal d'eau à gauche du joueur, sans jamais toucher "Click to Fish!"
WaterRatioX =0.324
WaterRatioY =0.556

; Intervalle entre chaque clic de pêche quand la macro est active (en millisecondes)
; Le jeu pêche en continu si vous cliquez régulièrement sur l'eau
FishClickIntervalMs = 1200

; Intervalle Anti-AFK (en secondes, Roblox déco à 20 min -> 180s = 3 minutes)
AntiAfkIntervalSeconds = 180

[Sound_Settings]
; Bips sonores lors des actions (1 = Activé, 0 = Muet / Totalement silencieux)
EnableSoundBeep = 0

[Event_Settings]
; Décalage en secondes pour l'horloge des événements (cycle de 5 min : :00, :05, :10...)
EventClockOffsetSeconds = 0

